<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12" />
      <stop offset="50%" stop-color="#0C1322" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- Neon Text Gradients -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00FF88" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F5FF" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Clip Path for the Ticker Viewport -->
    <clipPath id="tickerClip">
      <rect x="110" y="0" width="725" height="34" />
    </clipPath>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .pulse-glow {
      animation: pulse 2.5s ease-in-out infinite;
    }
    .tech-font {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Courier New', monospace;
      font-weight: 900;
    }
    .mono-font {
      font-family: 'Consolas', 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
    }
  </style>

  <!-- Container Base -->
  <rect width="900" height="220" rx="12" fill="url(#bgGrad)" stroke="#00F5FF" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Cyber Grid Overlay -->
  <rect width="900" height="220" rx="12" fill="url(#cyberGrid)" />

  <!-- Corner Tech Accents -->
  <path d="M 12 35 L 12 12 L 35 12" fill="none" stroke="#00F5FF" stroke-width="2.5" />
  <path d="M 888 35 L 888 12 L 865 12" fill="none" stroke="#00F5FF" stroke-width="2.5" />
  <path d="M 12 185 L 12 208 L 35 208" fill="none" stroke="#00F5FF" stroke-width="2.5" />
  <path d="M 888 185 L 888 208 L 865 208" fill="none" stroke="#00F5FF" stroke-width="2.5" />

  <!-- Radar / Status Top Bar -->
  <rect x="25" y="24" width="850" height="24" rx="4" fill="#0E182A" stroke="#00F5FF" stroke-width="0.7" stroke-opacity="0.25" />
  <circle cx="44" cy="36" r="4.5" fill="#00FF88" class="pulse-glow" />
  <text x="58" y="40" fill="#00E5FF" font-size="11" class="mono-font" font-weight="600" letter-spacing="1.5">SYS.DIAGNOSTICS // ZERO-OVERHEAD WIN32 KERNEL C-FFI // ONLINE</text>
  <text x="780" y="40" fill="#00FF88" font-size="11" class="mono-font" font-weight="700" letter-spacing="1">PRO v2.0</text>

  <!-- Main Hero Title -->
  <g filter="url(#neonGlow)">
    <text x="450" y="105" text-anchor="middle" fill="url(#cyberNeon)" font-size="44" class="tech-font" letter-spacing="6">TASKMAN ULTIMATE</text>
  </g>

  <!-- Subtitle -->
  <text x="450" y="132" text-anchor="middle" fill="#88A0C0" font-size="12.5" class="mono-font" letter-spacing="2.5" opacity="0.9">
    WINDOWS TELEMETRY &amp; ADVANCED PROCESS FORENSICS WORKSTATION
  </text>

  <!-- Accent Divider -->
  <rect x="180" y="146" width="540" height="2" fill="url(#accentBar)" />

  <!-- Continuous Auto-Scrolling Ticker / Marquee Container -->
  <g transform="translate(25, 163)">
    <rect width="850" height="34" rx="6" fill="#050912" stroke="#00F5FF" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Ticker Label Badge -->
    <rect x="0" y="0" width="100" height="34" rx="6" fill="#002B3D" stroke="#00F5FF" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="50" y="21" text-anchor="middle" fill="#00F5FF" font-size="10.5" class="mono-font" font-weight="700" letter-spacing="1">AUTO-SCROLL ▶</text>

    <!-- Infinite Auto-Scrolling Stream using SMIL Animation (Universal Support) -->
    <g clip-path="url(#tickerClip)">
      <g>
        <animateTransform
          attributeName="transform"
          type="translate"
          from="0 0"
          to="-1280 0"
          dur="22s"
          repeatCount="indefinite" />
        <!-- Segment 1 -->
        <text x="110" y="21" fill="#00FF88" font-size="12" class="mono-font" letter-spacing="1.2">
          ⚡ [RAM COMPACTOR: READY] ✦ 🛡️ [HANDLE LOCK HUNTER: ACTIVE] ✦ ⚡ [NUCLEAR TREE KILL /T: ARMED] ✦ 🌐 [GEOIP CLOUD SCOPE: SYNCED] ✦ 🌡️ [THERMAL GUARDIAN: 38°C] ✦ 📊 [FLIGHT RECORDER: 60 FPS] ✦
        </text>
        <!-- Segment 2 for continuous seamless loop -->
        <text x="1390" y="21" fill="#00FF88" font-size="12" class="mono-font" letter-spacing="1.2">
          ⚡ [RAM COMPACTOR: READY] ✦ 🛡️ [HANDLE LOCK HUNTER: ACTIVE] ✦ ⚡ [NUCLEAR TREE KILL /T: ARMED] ✦ 🌐 [GEOIP CLOUD SCOPE: SYNCED] ✦ 🌡️ [THERMAL GUARDIAN: 38°C] ✦ 📊 [FLIGHT RECORDER: 60 FPS] ✦
        </text>
      </g>
    </g>
  </g>
</svg>
