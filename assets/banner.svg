<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="170">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12" />
      <stop offset="50%" stop-color="#0C1322" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- Neon Text Gradients -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#00F5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00FF88" stop-opacity="1.0" />
      <stop offset="70%" stop-color="#9D4EDD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.1" />
    </linearGradient>

    <!-- Crisp Glow Filter -->
    <filter id="crispGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F5FF" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }
    .pulse-glow {
      animation: pulse 2.5s ease-in-out infinite;
    }
    .tech-title {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      font-weight: 900;
    }
    .mono-tech {
      font-family: 'Cascadia Code', 'Consolas', 'Fira Code', 'Courier New', monospace;
    }
  </style>

  <!-- Container Base Box -->
  <rect width="900" height="170" rx="10" fill="url(#bgGrad)" stroke="#00F5FF" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Grid Texture Overlay -->
  <rect width="900" height="170" rx="10" fill="url(#cyberGrid)" />

  <!-- Precision Cyber Corner Brackets -->
  <path d="M 12 32 L 12 12 L 32 12" fill="none" stroke="#00F5FF" stroke-width="2.5" />
  <path d="M 888 32 L 888 12 L 868 12" fill="none" stroke="#00F5FF" stroke-width="2.5" />
  <path d="M 12 138 L 12 158 L 32 158" fill="none" stroke="#00F5FF" stroke-width="2.5" />
  <path d="M 888 138 L 888 158 L 868 158" fill="none" stroke="#00F5FF" stroke-width="2.5" />

  <!-- Header Telemetry Diagnostic Strip -->
  <rect x="25" y="20" width="850" height="24" rx="4" fill="#0E182A" stroke="#00F5FF" stroke-width="0.7" stroke-opacity="0.25" />
  <circle cx="44" cy="32" r="4.5" fill="#00FF88" class="pulse-glow" />
  <text x="58" y="36" fill="#00E5FF" font-size="11" class="mono-tech" font-weight="600" letter-spacing="1.5">SYS.DIAGNOSTICS // ZERO-OVERHEAD WIN32 KERNEL C-FFI // ONLINE</text>
  <text x="785" y="36" fill="#00FF88" font-size="11" class="mono-tech" font-weight="700" letter-spacing="1">PRO v2.0</text>

  <!-- Main Hero Title: Razor Sharp Typography -->
  <g filter="url(#crispGlow)">
    <text x="450" y="98" text-anchor="middle" fill="url(#cyberNeon)" font-size="44" class="tech-title" letter-spacing="6">TASKMAN ULTIMATE</text>
  </g>

  <!-- Subtitle -->
  <text x="450" y="126" text-anchor="middle" fill="#88A0C0" font-size="12" class="mono-tech" font-weight="500" letter-spacing="3" opacity="0.95">
    WINDOWS TELEMETRY &amp; ADVANCED PROCESS FORENSICS WORKSTATION
  </text>

  <!-- Glowing Accent Divider Bar -->
  <rect x="160" y="140" width="580" height="2.5" rx="1" fill="url(#accentBar)" />
</svg>
