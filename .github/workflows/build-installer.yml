name: Build Windows Release & Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v2.0.0, v2.1.0)'
        required: true
        type: string
        default: 'v2.0.0'
      release_title:
        description: 'Release Title (optional, e.g., TaskMan Ultimate v2.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag & Title
        id: release_info
        shell: pwsh
        run: |
          $manualTag = "${{ github.event.inputs.release_tag }}".Trim()
          $manualTitle = "${{ github.event.inputs.release_title }}".Trim()

          if ($manualTag) {
            $tag = $manualTag
          } elseif ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $tag = $env:GITHUB_REF.Substring(10)
          } else {
            $tag = "v2.0.0"
          }

          if ($manualTitle) {
            $title = $manualTitle
          } else {
            $title = "TaskMan Ultimate $tag"
          }

          Write-Host "Target Tag: $tag"
          Write-Host "Target Title: $title"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Flutter Windows Application (Release)
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path "build\installer"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/taskman_ultimate_setup.iss

      - name: Package Portable Zip Archive
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\installer\TaskMan-Ultimate-Portable-v2.0.zip" -Force

      - name: Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskMan-Ultimate-Windows
          path: build/installer/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: |
            build/installer/TaskMan-Ultimate-Setup-v2.0.exe
            build/installer/TaskMan-Ultimate-Portable-v2.0.zip
          generate_release_notes: true
          draft: false
          prerelease: false
