name: Build Windows Release & Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Flutter Windows Application (Release)
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path "build\installer"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/taskman_ultimate_setup.iss

      - name: Package Portable Zip Archive
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\installer\TaskMan-Ultimate-Portable-v2.0.zip" -Force

      - name: Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskMan-Ultimate-v2.0-Windows
          path: build/installer/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          name: TaskMan Ultimate ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          files: |
            build/installer/TaskMan-Ultimate-Setup-v2.0.exe
            build/installer/TaskMan-Ultimate-Portable-v2.0.zip
          generate_release_notes: true
          draft: false
          prerelease: false
