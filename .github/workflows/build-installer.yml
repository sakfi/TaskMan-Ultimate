name: Build Windows Release & Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v2.0.0, v2.1.0)'
        required: true
        type: string
        default: 'v2.0.0'
      release_title:
        description: 'Release Title (optional, e.g., TaskMan Ultimate v2.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag & Title
        id: release_info
        shell: pwsh
        run: |
          $manualTag = "${{ github.event.inputs.release_tag }}".Trim()
          $manualTitle = "${{ github.event.inputs.release_title }}".Trim()

          if ($manualTag) {
            $tag = $manualTag
          } elseif ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $tag = $env:GITHUB_REF.Substring(10)
          } else {
            $tag = "v2.0.1"
          }

          # Clean numerical version for Windows binaries & Inno Setup
          $cleanVersion = $tag.TrimStart('v').Trim()
          if (-not $cleanVersion) { $cleanVersion = "2.0.1" }

          $setupBaseName = "TaskMan-Ultimate-Setup-$tag"
          $portableBaseName = "TaskMan-Ultimate-Portable-$tag"

          if ($manualTitle) {
            $title = $manualTitle
          } else {
            $title = "TaskMan Ultimate $tag"
          }

          Write-Host "Target Tag: $tag"
          Write-Host "Clean Version: $cleanVersion"
          Write-Host "Setup File: $setupBaseName.exe"
          Write-Host "Portable File: $portableBaseName.zip"
          Write-Host "Target Title: $title"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "clean_version=$cleanVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_basename=$setupBaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portable_basename=$portableBaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Flutter Windows Application (Release)
        run: flutter build windows --release --build-name=${{ steps.release_info.outputs.clean_version }}

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\installer"
          $cleanVer = "${{ steps.release_info.outputs.clean_version }}"
          $setupName = "${{ steps.release_info.outputs.setup_basename }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$cleanVer" /DOutputBaseFilename="$setupName" windows/installer/taskman_ultimate_setup.iss

      - name: Package Portable Zip Archive
        shell: pwsh
        run: |
          $portablePath = "build\installer\${{ steps.release_info.outputs.portable_basename }}.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $portablePath -Force

      - name: Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskMan-Ultimate-${{ steps.release_info.outputs.tag }}
          path: build/installer/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: |
            build/installer/${{ steps.release_info.outputs.setup_basename }}.exe
            build/installer/${{ steps.release_info.outputs.portable_basename }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
